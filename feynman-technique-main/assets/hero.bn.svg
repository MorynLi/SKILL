<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 618" width="1200" height="618" role="img" aria-label="feynman-technique — feynman-technique বন্ধ: এটা same-origin policy-জনিত CORS ত্রুটি। browser আগে preflight OPTIONS পাঠাচ্ছে। response-এ Access-Control-Allow-Origin নেই। তাই response body-টা browser block করেছে। API-র allowed origins-এ আপনার origin নেই। server-এ CORS middleware যোগ করে দিচ্ছি। middleware-এ CORS header config যোগ করব? — feynman-technique চালু: আপনার কোড ফেল করেনি, browser-ই থামিয়ে দিয়েছে। request গেছে, উত্তরও ফিরেছে, browser আপনাকে দেয়নি। আপনি হয়তো ওখানে আগে থেকেই ঢুকে আছেন। নিয়মটা না থাকলে যে কেউ আপনার login-এর ভেতরটা পড়ত। ওই server-কে বলতে হয় আপনার origin চলবে। সে কথাটা কখনো বলেনি, তাই আটকে গেছে। একই request Postman-এ চলে, browser-এ আটকায়। Postman কাউকে বাঁচাচ্ছে না, browser আপনাকে বাঁচাচ্ছে। সেই কথাটাই আমি ওই server-এ লিখে দেব। ওই server-এ আপনার origin-কে অনুমতি দিয়ে দিই?">
  <defs>
    <style>
