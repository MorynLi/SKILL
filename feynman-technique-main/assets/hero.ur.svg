<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="feynman-technique — skill کے بغیر: یہ CORS کا issue ہے، same-origin policy کے تحت۔ براؤزر preflight OPTIONS ریکویسٹ بھیج رہا ہے۔ response میں Access-Control-Allow-Origin غائب ہے۔ server آپ کے origin کو whitelist نہیں کر رہا۔ allowed origins اور headers set کرنے ہوں گے۔ server.js میں CORS middleware add کر دیتا ہوں۔ server.js میں CORS middleware add کر دوں؟ — skill کے ساتھ: آپ کا کوڈ ناکام نہیں ہوا — براؤزر نے روکا ہے۔ ریکویسٹ وہاں پہنچی، جواب بھی واپس آ گیا۔ براؤزر نے وہ جواب آپ تک پہنچنے نہیں دیا۔ ہو سکتا ہے آپ وہاں پہلے سے لاگ اِن ہوں۔ ورنہ ہر کھلا ٹیب آپ کے لاگ اِن میں جھانک لیتا۔ اُس سائٹ کو آپ کا ڈومین اجازت میں لکھنا تھا۔ اُس نے کبھی نہیں لکھا — اِس لیے جواب رُک گیا۔ Postman میں وہی ریکویسٹ چلتی ہے، براؤزر میں نہیں۔ Postman کسی کو نہیں بچاتا، براؤزر آپ کو بچاتا ہے۔ میں آپ کا پتہ API کی اجازت میں لکھ دیتا ہوں۔ server.js میں آپ کا پتہ اجازت میں لکھ دوں؟">
  <defs>
    <style>
      .body { font-family: "Noto Nastaliq Urdu", "Noto Sans Arabic", Tahoma, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="670" fill="#171614"/>
  <text x="1128" y="46" font-size="19" fill="#e9e6df" text-anchor="start" class="body" font-weight="700" direction="rtl">فائن مین تکنیک</text>
  <text x="72" y="46" font-size="12" fill="#5b5850" text-anchor="start" class="mono" letter-spacing="3.2">ایک Agent Skill</text>
  <line x1="72" y1="70" x2="1128" y2="70" stroke="#2a2823" stroke-width="1"/>
  <rect x="72" y="92" width="1056" height="64" rx="10" fill="#262624" stroke="#37352f" stroke-width="1"/>
  <text x="1106" y="127" font-size="15" fill="#d97757" text-anchor="end" class="mono" font-weight="700">›</text>
  <text x="1088" y="127" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">checkout کے آرڈر لوڈ ہی نہیں ہو رہے، کیا کروں؟</text>
  <rect x="615" y="182" width="513" height="418" rx="10" fill="#262624" stroke="#e5484d" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M615 218 V192 a10 10 0 0 1 10 -10 H1118 a10 10 0 0 1 10 10 V218 Z" fill="#241b1a"/>
  <line x1="615" y1="218" x2="1128" y2="218" stroke="#37352f" stroke-width="1"/>
  <circle cx="635" cy="200" r="4" fill="#4a4741"/>
  <circle cx="650" cy="200" r="4" fill="#4a4741"/>
  <circle cx="665" cy="200" r="4" fill="#4a4741"/>
  <text x="1112" y="204" font-size="12" fill="#e5484d" text-anchor="start" class="body" font-weight="700" direction="rtl">skill کے بغیر</text>
  <text x="1106" y="257" font-size="13" fill="#9a968d" text-anchor="start" class="body" direction="rtl">یہ CORS کا issue ہے، same-origin policy کے تحت۔</text>
  <text x="1106" y="283" font-size="13" fill="#9a968d" text-anchor="start" class="body" direction="rtl">براؤزر preflight OPTIONS ریکویسٹ بھیج رہا ہے۔</text>
  <text x="1106" y="309" font-size="13" fill="#9a968d" text-anchor="start" class="body" direction="rtl">response میں Access-Control-Allow-Origin غائب ہے۔</text>
  <text x="1106" y="335" font-size="13" fill="#9a968d" text-anchor="start" class="body" direction="rtl">server آپ کے origin کو whitelist نہیں کر رہا۔</text>
  <text x="1106" y="361" font-size="13" fill="#9a968d" text-anchor="start" class="body" direction="rtl">allowed origins اور headers set کرنے ہوں گے۔</text>
  <text x="1106" y="387" font-size="13" fill="#9a968d" text-anchor="start" class="body" direction="rtl">server.js میں CORS middleware add کر دیتا ہوں۔</text>
  <text x="1106" y="543" font-size="13" fill="#e9e6df" text-anchor="start" class="body" font-weight="600" direction="rtl">server.js میں CORS middleware add کر دوں؟</text>
  <text x="1106" y="573" font-size="13" fill="#d97757" text-anchor="end" class="mono">❯</text>
  <text x="1086" y="573" font-size="13" fill="#e9e6df" text-anchor="start" class="body" font-weight="600" direction="rtl">ہاں</text>
  <text x="1043" y="573" font-size="13" fill="#5b5850" text-anchor="start" class="body" direction="rtl">نہیں</text>
  <rect x="72" y="182" width="513" height="418" rx="10" fill="#262624" stroke="#4cc38a" stroke-opacity="0.55" stroke-width="1"/>
  <path d="M72 218 V192 a10 10 0 0 1 10 -10 H575 a10 10 0 0 1 10 10 V218 Z" fill="#1a241e"/>
  <line x1="72" y1="218" x2="585" y2="218" stroke="#37352f" stroke-width="1"/>
  <circle cx="92" cy="200" r="4" fill="#4a4741"/>
  <circle cx="107" cy="200" r="4" fill="#4a4741"/>
  <circle cx="122" cy="200" r="4" fill="#4a4741"/>
  <text x="569" y="204" font-size="12" fill="#4cc38a" text-anchor="start" class="body" font-weight="700" direction="rtl">skill کے ساتھ</text>
  <text x="563" y="257" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">آپ کا کوڈ ناکام نہیں ہوا — براؤزر نے روکا ہے۔</text>
  <text x="563" y="283" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">ریکویسٹ وہاں پہنچی، جواب بھی واپس آ گیا۔</text>
  <text x="563" y="309" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">براؤزر نے وہ جواب آپ تک پہنچنے نہیں دیا۔</text>
  <text x="563" y="335" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">ہو سکتا ہے آپ وہاں پہلے سے لاگ اِن ہوں۔</text>
  <text x="563" y="361" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">ورنہ ہر کھلا ٹیب آپ کے لاگ اِن میں جھانک لیتا۔</text>
  <text x="563" y="387" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">اُس سائٹ کو آپ کا ڈومین اجازت میں لکھنا تھا۔</text>
  <text x="563" y="413" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">اُس نے کبھی نہیں لکھا — اِس لیے جواب رُک گیا۔</text>
  <text x="563" y="439" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">Postman میں وہی ریکویسٹ چلتی ہے، براؤزر میں نہیں۔</text>
  <text x="563" y="465" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">Postman کسی کو نہیں بچاتا، براؤزر آپ کو بچاتا ہے۔</text>
  <text x="563" y="491" font-size="13" fill="#e9e6df" text-anchor="start" class="body" direction="rtl">میں آپ کا پتہ API کی اجازت میں لکھ دیتا ہوں۔</text>
  <text x="563" y="543" font-size="13" fill="#e9e6df" text-anchor="start" class="body" font-weight="600" direction="rtl">server.js میں آپ کا پتہ اجازت میں لکھ دوں؟</text>
  <text x="563" y="573" font-size="13" fill="#d97757" text-anchor="end" class="mono">❯</text>
  <text x="543" y="573" font-size="13" fill="#e9e6df" text-anchor="start" class="body" font-weight="600" direction="rtl">ہاں</text>
  <text x="500" y="573" font-size="13" fill="#5b5850" text-anchor="start" class="body" direction="rtl">نہیں</text>
  <text x="72" y="644" font-size="13" fill="#5b5850" text-anchor="start" class="body" font-style="italic">“There is a difference between the name of the thing and what goes on.”</text>
  <text x="1128" y="644" font-size="13" fill="#5b5850" text-anchor="end" class="body">R. P. Feynman, 1966</text>
</svg>
