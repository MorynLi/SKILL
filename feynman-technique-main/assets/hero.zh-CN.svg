<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 631" width="1200" height="631" role="img" aria-label="feynman-technique — 未加载 feynman-technique: 这是浏览器同源策略引发的跨域拦截。 前端域名与接口域名不一致，触发了预检请求。 预检的 OPTIONS 请求没有被正确处理。 服务端响应头缺少 Allow-Origin。 建议在服务端加中间件，统一注入这些响应头。 我改 server.js，接入 CORS 中间件。 修改 server.js，注入 CORS 响应头？ — 已加载 feynman-technique: 你的代码没写错。拦住它的是浏览器。 请求发出去了，数据也回来了，浏览器扣着不给你。 你可能正登录着那个站。 不然别的页面都能借你的身份读数据。 对方服务器得点名说你这个域名可以。它没说。 同样的请求，Postman 里一点事没有。 换到浏览器里，就拿不到了。 Postman 不用护着谁，浏览器护着的是你。 我去那边的服务器上，把你的地址写进名单。 要我在那台服务器上加一句「你这个地址可以」吗？">
  <defs>
    <style>
      .body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1200" height="631" fill="#171614"/>
  <text x="72" y="46" font-size="19" fill="#e9e6df" text-anchor="start" class="body" font-weight="700">费曼技巧</text>
  <text x="1128" y="46" font-size="12" fill="#5b5850" text-anchor="end" class="mono" letter-spacing="3.2">一个 Agent Skill</text>
  <line x1="72" y1="70" x2="1128" y2="70" stroke="#2a2823" stroke-width="1"/>
  <rect x="72" y="92" width="1056" height="63" rx="10" fill="#262624" stroke="#37352f" stroke-width="1"/>
  <text x="94" y="128" font-size="16" fill="#d97757" text-anchor="start" class="mono" font-weight="700">›</text>
  <text x="112" y="128" font-size="14" fill="#e9e6df" text-anchor="start" class="body">订单列表死活出不来，我也不知道哪错了</text>
  <rect x="72" y="181" width="513" height="380" rx="10" fill="#262624" stroke="#e5484d" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M72 217 V191 a10 10 0 0 1 10 -10 H575 a10 10 0 0 1 10 10 V217 Z" fill="#241b1a"/>
  <line x1="72" y1="217" x2="585" y2="217" stroke="#37352f" stroke-width="1"/>
  <circle cx="92" cy="199" r="4" fill="#4a4741"/>
  <circle cx="107" cy="199" r="4" fill="#4a4741"/>
  <circle cx="122" cy="199" r="4" fill="#4a4741"/>
  <text x="569" y="203" font-size="12" fill="#e5484d" text-anchor="end" class="mono" font-weight="700">未加载 feynman-technique</text>
  <text x="94" y="257" font-size="14" fill="#9a968d" text-anchor="start" class="body">这是浏览器同源策略引发的跨域拦截。</text>
  <text x="94" y="282" font-size="14" fill="#9a968d" text-anchor="start" class="body">前端域名与接口域名不一致，触发了预检请求。</text>
  <text x="94" y="307" font-size="14" fill="#9a968d" text-anchor="start" class="body">预检的 OPTIONS 请求没有被正确处理。</text>
  <text x="94" y="332" font-size="14" fill="#9a968d" text-anchor="start" class="body">服务端响应头缺少 Allow-Origin。</text>
  <text x="94" y="357" font-size="14" fill="#9a968d" text-anchor="start" class="body">建议在服务端加中间件，统一注入这些响应头。</text>
  <text x="94" y="382" font-size="14" fill="#9a968d" text-anchor="start" class="body">我改 server.js，接入 CORS 中间件。</text>
  <text x="94" y="507" font-size="14" fill="#e9e6df" text-anchor="start" class="body" font-weight="600">修改 server.js，注入 CORS 响应头？</text>
  <text x="94" y="536" font-size="14" fill="#d97757" text-anchor="start" class="mono">❯</text>
  <text x="114" y="536" font-size="14" fill="#e9e6df" text-anchor="start" class="body" font-weight="600">是</text>
  <text x="139" y="536" font-size="14" fill="#5b5850" text-anchor="start" class="body">否</text>
  <rect x="615" y="181" width="513" height="380" rx="10" fill="#262624" stroke="#4cc38a" stroke-opacity="0.55" stroke-width="1"/>
  <path d="M615 217 V191 a10 10 0 0 1 10 -10 H1118 a10 10 0 0 1 10 10 V217 Z" fill="#1a241e"/>
  <line x1="615" y1="217" x2="1128" y2="217" stroke="#37352f" stroke-width="1"/>
  <circle cx="635" cy="199" r="4" fill="#4a4741"/>
  <circle cx="650" cy="199" r="4" fill="#4a4741"/>
  <circle cx="665" cy="199" r="4" fill="#4a4741"/>
  <text x="1112" y="203" font-size="12" fill="#4cc38a" text-anchor="end" class="mono" font-weight="700">已加载 feynman-technique</text>
  <text x="637" y="257" font-size="14" fill="#e9e6df" text-anchor="start" class="body">你的代码没写错。拦住它的是浏览器。</text>
  <text x="637" y="282" font-size="14" fill="#e9e6df" text-anchor="start" class="body">请求发出去了，数据也回来了，浏览器扣着不给你。</text>
  <text x="637" y="307" font-size="14" fill="#e9e6df" text-anchor="start" class="body">你可能正登录着那个站。</text>
  <text x="637" y="332" font-size="14" fill="#e9e6df" text-anchor="start" class="body">不然别的页面都能借你的身份读数据。</text>
  <text x="637" y="357" font-size="14" fill="#e9e6df" text-anchor="start" class="body">对方服务器得点名说你这个域名可以。它没说。</text>
  <text x="637" y="382" font-size="14" fill="#e9e6df" text-anchor="start" class="body">同样的请求，Postman 里一点事没有。</text>
  <text x="637" y="407" font-size="14" fill="#e9e6df" text-anchor="start" class="body">换到浏览器里，就拿不到了。</text>
  <text x="637" y="432" font-size="14" fill="#e9e6df" text-anchor="start" class="body">Postman 不用护着谁，浏览器护着的是你。</text>
  <text x="637" y="457" font-size="14" fill="#e9e6df" text-anchor="start" class="body">我去那边的服务器上，把你的地址写进名单。</text>
  <text x="637" y="507" font-size="14" fill="#e9e6df" text-anchor="start" class="body" font-weight="600">要我在那台服务器上加一句「你这个地址可以」吗？</text>
  <text x="637" y="536" font-size="14" fill="#d97757" text-anchor="start" class="mono">❯</text>
  <text x="657" y="536" font-size="14" fill="#e9e6df" text-anchor="start" class="body" font-weight="600">是</text>
  <text x="682" y="536" font-size="14" fill="#5b5850" text-anchor="start" class="body">否</text>
  <text x="72" y="605" font-size="13" fill="#5b5850" text-anchor="start" class="body" font-style="italic">“There is a difference between the name of the thing and what goes on.”</text>
  <text x="1128" y="605" font-size="13" fill="#5b5850" text-anchor="end" class="body">R. P. Feynman, 1966</text>
</svg>
